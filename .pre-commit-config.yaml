repos:
  - repo: local
    hooks:
      - id: check-skills
        name: Check skill structure
        entry: python3 scripts/check_skills.py
        language: system
        pass_filenames: false
      - id: check-website-data
        name: Check generated website skill data
        entry: python3 scripts/build_website_data.py --check
        language: system
        pass_filenames: false
      - id: test-spec-delivery-workflow
        name: Test Spec delivery workflow
        entry: python3 -m unittest discover -s tests
        language: system
        pass_filenames: false
      - id: staged-diff-check
        name: Check staged diff
        entry: git diff --cached --check
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
